[package]
name = "orion-scheduler"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "orion-scheduler"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "signal", "process"] }
axum = { workspace = true, features = ["macros", "ws"] }
tower-http = { workspace = true, features = ["cors", "trace"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
futures-util = { workspace = true }
async-stream = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Git dep (not path): Docker/CI workspaces cannot see a sibling ../../qlean checkout.
# Pin the InteractiveShell PTY API (0.3.1); crates.io is still at 0.3.0.
qlean = { git = "https://github.com/benjamin-747/qlean.git", rev = "c3bf91e0f4020b580fd5bfe5d3d7d22bc3754651" }

[dev-dependencies]
anyhow = { workspace = true }
