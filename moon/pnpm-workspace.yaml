packages:
  - apps/*
  - packages/*
patchedDependencies:
  '@radix-ui/react-popper@1.2.7': patches/@radix-ui__react-popper@1.2.7.patch
peerDependencyRules:
  allowedVersions:
    react: '*'
    react-dom: '*'
    next: '*'
    eslint: '*'
    styled-components: '*'
overrides:
  # Node 26-compatible native binding (metascraper → url-regex-safe optional peer)
  re2: 1.26.1
  # Keep patched transitive Radix popper on the exact patched version
  '@radix-ui/react-popper': 1.2.7
allowBuilds:
  '@vercel/speed-insights': true
  core-js-pure: true
  esbuild: true
  re2: true
  sharp: true
  unrs-resolver: true
# pnpm 11 default release-age gate blocks brand-new publishes during install
minimumReleaseAge: 0
# - next / eslint-config-next / @next/bundle-analyzer: pinned 16.2.11 (upgrade target; already latest 16.x)
# - @tiptap/*: ^3 (Details via OSS @tiptap/extension-details; collaboration-caret; list/extensions kits)
# - @radix-ui/react-popper: override-pinned 1.2.7 + patchedDependencies; regenerating required before >1.2.7
# - typescript: ^5.9 — TS 7 not yet validated with Next 16 / eslint-config-next
# - eslint: ^9.39 — ESLint 10 breaks eslint-config-next@16 / plugin stack
# - react-day-picker: ^9.8 — not v10 (further Calendar API rewrite)
# - @primer/react + @primer/primitives: ^38 / ^11 (upgraded together)
# - @shopify/react-shortcuts: ^5.2.0 — latest; peer still react<19 (allowed via peerDependencyRules)
# - nextjs-cors: ^2.2.1 — latest; peer declares next<=14 (allowed via peerDependencyRules)
# - uuid: ^9.0.1 — uuid 10+ is pure ESM, breaks CJS/tsup consumers
# - swagger-typescript-api: ^12.0.4 — v13 CLI/output breaking
# - @mui/x-tree-view: pin 8.5.0 — newer 8.x tightens TreeViewDefaultItemModelProperties (no content_type)
# - @mui/material|icons-material: ^7.3 — not v9
# - react-dropzone: ^14 — not v19
# - @pierre/diffs: apps/web pinned 1.2.12 (bundler + DiffView hunk API); not catalogued
# - tailwindcss: ^4 (+ @tailwindcss/postcss, forms/typography, safe-area ^1, tailwind-merge ^3); container-queries removed (built-in)
#
